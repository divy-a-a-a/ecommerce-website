<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="outer">
        <h1>signup page</h1>
        <form action="">
            <label for="">Name</label>
            <input type="text" placeholder="enter your name" id="name" autocomplete="off">
            <label for="">email</label>
            <input type="email" id="email" placeholder="enter your mail id">
            <label for="">password</label>
            <input type="password" placeholder="enter your password" id="pass1">
            <label for=""> confirm password</label>
            <input type="password" placeholder="enter your password" id="pass2">

            <button>register</button>
        </form>

        <footer>
            <p>already have an account ?</p>
            <a href="login.html">login</a>
        </footer>
    </div>
    <script src="signup.js"></script>
</body>
</html>
